name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: run.sh dry-run with the shipped defaults
        run: VALIDATE_ONLY=1 ./run.sh
      - name: run.sh dry-run, single rank control
        run: VALIDATE_ONLY=1 TP=1 CONTEXT=65536 ./run.sh
      - name: run.sh dry-run, concurrent profile (PR-141 patch)
        run: VALIDATE_ONLY=1 PROFILE=concurrent ./run.sh
      - name: run.sh refuses --parallel at TP=2 on the 0.6.2 image
        run: |
          if VALIDATE_ONLY=1 PARALLEL=4 ./run.sh; then
            echo "run.sh accepted PARALLEL=4 at TP=2 on TensorFold 0.6.2" >&2
            exit 1
          fi
      - name: run.sh refuses a window above the native 262144
        run: |
          if VALIDATE_ONLY=1 CONTEXT=524288 ./run.sh; then
            echo "run.sh accepted CONTEXT=524288" >&2
            exit 1
          fi
      - name: run.sh refuses EXTRA_ARGS that re-set an owned flag
        run: |
          if VALIDATE_ONLY=1 EXTRA_ARGS="--mtp-drafts 3" ./run.sh; then
            echo "run.sh accepted --mtp-drafts in EXTRA_ARGS" >&2
            exit 1
          fi
      - name: run.sh refuses vision at TP=2
        run: |
          if VALIDATE_ONLY=1 EXTRA_ARGS="--vision" ./run.sh; then
            echo "run.sh accepted --vision" >&2
            exit 1
          fi
      - name: run.sh refuses zero-padded integers
        run: |
          if VALIDATE_ONLY=1 MAX_TOKENS=04096 ./run.sh; then
            echo "run.sh accepted MAX_TOKENS=04096" >&2
            exit 1
          fi

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -S warning run.sh stop.sh tools/session_gate.sh tools/sweep.sh tools/run_t3.sh evidence/s5-longctx/abab.sh evidence/s6-pr141/gpu_tests.sh

  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -q
