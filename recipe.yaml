# Source of truth for the values that repeat across run.sh, README.md and CI.
# Edit here, then `python3 kit/render.py`. CI runs `python3 kit/render.py --check`.
# Every scalar is used as the string you typed (0.70 stays 0.70). `null` means none.
# `&name` anchors a value; `*name` reuses it, so a pinned value is written once.

model:
  id: &model TensorFold/Qwen3.8-Flash-Next-MLX-4bit-MTP
  revision: &revision 2b170fa6309d5d1ee380b35636075fac7945f286
  served_name: &served_name TensorFold/Qwen3.8-Flash-Next-MLX-4bit-MTP
  family: Qwen3.8-Flash-Next
  params: ~180B total MoE, 512 experts top-10, 1 MTP layer, hashed n-gram (PLE) tables
  quant: MLX affine 4-bit, group 32, every linear incl. the n-gram tables and the MTP head (router bf16)

image:
  base: nvcr.io/nvidia/pytorch:26.07-py3
  digest: sha256:2140e699b3beaf7f96a0081fd9c9406bc3832b435cdb60dfa2d261f7d2f34a1c
  local_tag: &image tf-qwen38-flashnext:0.6.2
  build: docker/Dockerfile (pip install TensorFold at TF_SHA plus xgrammar 0.2.8; torch/triton from the base, checked)

engine:
  name: tensorfold
  version: 0.6.2
  repo: https://github.com/ashhart/TensorFold
  commit: &tf_sha 56e2e3ec55bc0ae1d7d5158c4fa2c79a3567ab21
  # sha256 of every shipped patch under docker/patches/ (run.sh PATCH_PINS must match; tests/ check the files).
  patches:
    pr141-on-0.6.2.patch: 03027e4f22233d5c4790ea56c7e5a0c5ec85d11e891a3ca238b2edf03ff51571

hardware:
  shape: 2x DGX Spark (GB10)
  nnodes: 2
  tp: &tp 2

serve:
  # The `# BEGIN generated` block of run.sh, in run.sh order. Each key renders as NAME="${NAME:-value}".
  env:
    MODEL: *model
    SERVED_NAME: *served_name
    IMAGE: *image
    TF_SHA: *tf_sha
    TF_PATCH: none
    CONTAINER_NAME: tf-qwen38-flashnext
    PORT: 8000
    MASTER_PORT: 29551
    HEAD_IP: 10.100.8.1
    WORKER_HOST: spark2
    IFACE: enp1s0f1np1
    HCA: rocep1s0f1,roceP2p1s0f1
    TP: *tp
    CONTEXT: 262144
    KV_DTYPE: bf16
    MTP_DRAFTS: 15
    MTP_CONFIDENCE: 0.70
    PARALLEL: 1
    THINKING: 0
    MAX_TOKENS: 4096
    MEMORY_RESERVE_GIB: ""
    HF_CACHE: $HOME/.cache/huggingface
    SNAPSHOT_SHA: *revision
    SKIP_DOWNLOAD: 0
    TF_CACHE: $HOME/.cache/tensorfold-qwen38
    ORCHESTRATE: auto
    OOM_SCORE_ADJ: 1000
    MEMGUARD: 1
    MEMGUARD_MIN_AVAIL_MB: 3072
    MEMGUARD_MIN_SWAP_FREE_MB: 2048
    BENCH_ONLY: 0
    EXTRA_ARGS: ""
    EXTRA_ENV: ""

readme:
  # Rows of the README "Defaults" table. {NAME} is replaced by serve.env.NAME.
  defaults:
    - Engine: "TensorFold `{TF_SHA}` (v0.6.2), built into `{IMAGE}` from `docker/Dockerfile`"
    - Model: "`{MODEL}` at `{SNAPSHOT_SHA}`"
    - Ranks: "`--tp {TP}`: rank 1 on `{WORKER_HOST}` first, then rank 0 (HTTP) on the head; rendezvous `{HEAD_IP}:{MASTER_PORT}`"
    - "`--context`": "{CONTEXT} (the native window, on both ranks)"
    - "`--kv-dtype`": "`{KV_DTYPE}`"
    - MTP drafts: "`--mtp-drafts {MTP_DRAFTS} --mtp-confidence {MTP_CONFIDENCE}`"
    - "`--parallel`": "{PARALLEL} (0.6.2 serves one request at a time on two ranks)"
    - Default thinking: "off (`THINKING={THINKING}`); requests override with `chat_template_kwargs.enable_thinking`"
    - "`--max-tokens`": "{MAX_TOKENS} (the reply cap when a request sets none)"
    - NCCL: "`NCCL_IB_HCA={HCA}`, `NCCL_SOCKET_IFNAME={IFACE}`"
    - API: "`http://<head>:{PORT}/v1`, served as `{SERVED_NAME}`"
    - Container: "`{CONTAINER_NAME}`"

measured:
  # The README decode table. One row per (phase, concurrency); a row's three numbers come from one
  # bench_decode.py run. evidence: the file under evidence/ that contains them, or null while there is none.
  decode:
    conditions: streamed greedy, thinking off, max_tokens 200 (prose ends at EOS near 100), 3-run median; TensorFold 0.6.2 at TP=2, context 262144, kv bf16, MTP up to 15 drafts at confidence 0.70, 4.33 tokens per verify round; second gate on the boot (the first gate on that boot measured up to 5.6% lower; s4's first-after-boot gate did not)
    units: {decode: tok/s per stream (median), aggregate: tok/s, ttft_p50: s}
    rows:
      - {phase: prose, concurrency: 1, decode: 69.6, aggregate: 69.6, ttft_p50: 0.05, evidence: evidence/s7-default/rerun/bench-frozen.out}
      - {phase: prose, concurrency: 2, decode: 70.0, aggregate: 92.1, ttft_p50: 0.78, evidence: evidence/s7-default/rerun/bench-frozen.out,
         note: "TensorFold 0.6.2 serves one request at a time on two ranks. At c=2 the second stream waits for the first, which is its TTFT, and bench_decode's aggregate (tokens / (wall − median TTFT)) is not concurrent throughput. TTFT p50 is the midpoint of the first stream's 0.05-0.06 s and the queued second stream's 1.51-1.53 s (prose) or 0.93-0.94 s (structured). The --parallel profile serves both together (Concurrency)."}
      - {phase: structured, concurrency: 1, decode: 249.5, aggregate: 249.3, ttft_p50: 0.07, evidence: evidence/s7-default/rerun/bench-frozen.out}
      - {phase: structured, concurrency: 2, decode: 246.8, aggregate: 317.5, ttft_p50: 0.49, evidence: evidence/s7-default/rerun/bench-frozen.out,
         note: "Same as note 1."}

links:
  model: https://huggingface.co/TensorFold/Qwen3.8-Flash-Next-MLX-4bit-MTP
  engine: https://github.com/ashhart/TensorFold
  base_image: https://catalog.ngc.nvidia.com/orgs/nvidia/containers/pytorch
  repo: https://github.com/sfxnz/Qwen3.8-Flash-Next-TensorFold-2x-DGX-Spark
  sibling_vllm: https://github.com/sfxnz/Qwen3.8-Flash-Next-NVFP4-vLLM-2x-DGX-Spark
